<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>identical-links-same-purpose — Links with the same name must have a similar purpose</title>
  <style>body { font-family: Arial, sans-serif; margin: 2rem; background: #fff; color: #000; }</style>
</head>
<body>
  <main>
    <h1>identical-links-same-purpose Test Case</h1>
    <p>SC 2.4.9 — Links with the same name must have a similar purpose.</p>
    <!-- VIOLATION: Two links with identical text "ACT rules11" pointing to different domains -->
    <a href="https://act-rules.github.io/">ACT rules11</a>
    <a href="https://www.w3.org/community/act-r/">ACT rules11</a>
  </main>
</body>
