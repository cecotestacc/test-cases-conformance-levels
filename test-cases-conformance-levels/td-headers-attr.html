<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>td-headers-attr — Table cell headers attributes must refer to th elements in the same table</title>
  <style>body { font-family: Arial, sans-serif; margin: 2rem; background: #fff; color: #000; }</style>
</head>
<body>
  <main>
    <h1>td-headers-attr Test Case</h1>
    <p>SC 1.3.1 — Table cell headers attributes must refer to other <code>&lt;th&gt;</code> elements in the same table.</p>
    <!-- VIOLATION: headers attributes reference IDs that don't match the actual th IDs -->
    <table>
      <tr>
        <th id="headerOfColumn1">Projects</th>
        <th id="headerOfColumn2">Objective</th>
      </tr>
      <tr>
        <td headers="headOfColumn1">15%</td>
        <td headers="headOfColumn2">10%</td>
      </tr>
    </table>
  </main>
</body>
</html>
