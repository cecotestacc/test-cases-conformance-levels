<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>frame-title-unique — Frames must have a unique title attribute</title>
  <style>body { font-family: Arial, sans-serif; margin: 2rem; background: #fff; color: #000; }</style>
</head>
<body>
  <main>
    <h1>frame-title-unique Test Case</h1>
    <p>SC 4.1.2 — Frames must have a unique title attribute.</p>
    <!-- VIOLATION: Two iframes with identical title attributes -->
    <iframe srcdoc="<p>Frame 1 content</p>" title="My Frame" width="200" height="50"></iframe>
    <iframe srcdoc="<p>Frame 2 content</p>" title="My Frame" width="200" height="50"></iframe>
  </main>
</body>
</html>
