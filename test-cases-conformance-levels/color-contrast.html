<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>color-contrast — Elements must meet minimum color contrast ratio thresholds</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; background: #fff; color: #000; }
    /* VIOLATION: light gray text on white background — contrast ratio well below 4.5:1 */
    .low-contrast { color: #aaa; background: #fff; font-size: 1rem; }
  </style>
</head>
<body>
  <main>
    <h1>color-contrast Test Case</h1>
    <p>SC 1.4.3 — Elements must meet minimum color contrast ratio thresholds.</p>
    <p class="low-contrast">This text has insufficient color contrast (#aaa on #fff).</p>
  </main>
</body>
</html>
