<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>area-alt — Active area elements must have alternative text</title>
  <style>body { font-family: Arial, sans-serif; margin: 2rem; background: #fff; color: #000; }</style>
</head>
<body>
  <main>
    <h1>area-alt Test Case</h1>
    <p>SC 2.4.4 / 4.1.2 — Active <code>&lt;area&gt;</code> elements must have alternative text.</p>
    <!-- VIOLATION: <area> is missing alt attribute -->
    <img src="data:image/gif;base64,R0lGODlhZABkAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
         alt="Image map" usemap="#testmap" width="100" height="100">
    <map name="testmap">
      <area shape="rect" coords="0,0,50,50" href="#section1">
    </map>
    <section id="section1"><h2>Section 1</h2><p>Target section.</p></section>
  </main>
</body>
</html>
