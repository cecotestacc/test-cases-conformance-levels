<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base Accessible Page</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; background: #fff; color: #000; }
    a { color: #005fcc; }
    a:focus, button:focus, input:focus, select:focus { outline: 3px solid #005fcc; }
    .skip-link { position: absolute; left: -9999px; }
    .skip-link:focus { left: 0; }
    label { display: block; margin-top: 1rem; }
    input, select, button { font-size: 1rem; padding: 0.4rem; margin-top: 0.25rem; }
    button { background: #005fcc; color: #fff; border: none; padding: 0.5rem 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <a href="#main" class="skip-link">Skip to main content</a>
  <main id="main">
    <h1>Accessible Page</h1>
    <p>This is a fully accessible base page.</p>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="#main">Home</a></li>
        <li><a href="#section1">Section 1</a></li>
      </ul>
    </nav>
    <section id="section1" aria-labelledby="sec1-heading">
      <h2 id="sec1-heading">Section One</h2>
      <p>Some content here.</p>
      <form>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" autocomplete="name">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email">
        <button type="submit">Submit</button>
      </form>
      <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Placeholder image" width="1" height="1">
    </section>
  </main>
</body>
</html>
