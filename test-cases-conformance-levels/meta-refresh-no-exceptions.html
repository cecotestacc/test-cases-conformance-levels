<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>meta-refresh-no-exceptions — Delayed refresh must not be used</title>
  <!-- VIOLATION: any non-zero meta refresh is prohibited at AAA level (SC 2.2.4 / 3.2.5) -->
  <meta http-equiv="refresh" content="300000">
  <style>body { font-family: Arial, sans-serif; margin: 2rem; background: #fff; color: #000; }</style>
</head>
<body>
  <main>
    <h1>meta-refresh-no-exceptions Test Case</h1>
    <p>SC 2.2.4 / 3.2.5 — Delayed refresh must not be used (no exceptions at AAA level).</p>
    <p>This page uses a meta refresh, which is not permitted.</p>
  </main>
</body>
</html>
