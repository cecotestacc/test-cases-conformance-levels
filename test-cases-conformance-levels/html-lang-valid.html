<!DOCTYPE html>
<!-- VIOLATION: lang attribute has invalid/non-existent language code -->
<html lang="zz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>html-lang-valid — html element must have a valid lang value</title>
  <style>body { font-family: Arial, sans-serif; margin: 2rem; background: #fff; color: #000; }</style>
</head>
<body>
  <main>
    <h1>html-lang-valid Test Case</h1>
    <p>SC 3.1.1 — The <code>&lt;html&gt;</code> element must have a valid value for the lang attribute.</p>
    <p>This page uses <code>lang="zz"</code> which is not a valid language code.</p>
  </main>
</body>
</html>
