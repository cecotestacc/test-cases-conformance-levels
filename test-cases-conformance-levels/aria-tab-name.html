<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aria-tab-name — ARIA tab nodes must have an accessible name</title>
  <style>body { font-family: Arial, sans-serif; margin: 2rem; background: #fff; color: #000; }</style>
</head>
<body>
  <main>
    <h1>aria-tab-name Test Case</h1>
    <p>SC 4.1.2 — ARIA tab nodes must have an accessible name.</p>
    <!-- VIOLATION: role="tab" with no accessible name -->
    <div role="tablist" aria-label="My tabs">
      <div role="tab" tabindex="0"></div>
    </div>
  </main>
</body>
</html>
