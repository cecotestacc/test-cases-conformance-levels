<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>listitem — li elements must be contained in a ul or ol</title>
  <style>body { font-family: Arial, sans-serif; margin: 2rem; background: #fff; color: #000; }</style>
</head>
<body>
  <main>
    <h1>listitem Test Case</h1>
    <p>SC 1.3.1 — <code>&lt;li&gt;</code> elements must be contained in a <code>&lt;ul&gt;</code> or <code>&lt;ol&gt;</code>.</p>
    <!-- VIOLATION: single <li> element directly in the page, not inside a list -->
    <li>Coffee</li>
  </main>
</body>
</html>
