<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aria-allowed-attr — Elements must only use supported ARIA attributes</title>
  <style>body { font-family: Arial, sans-serif; margin: 2rem; background: #fff; color: #000; }</style>
</head>
<body>
  <main>
    <h1>aria-allowed-attr Test Case</h1>
    <p>SC 4.1.2 — Elements must only use supported ARIA attributes.</p>
    <!-- VIOLATION: aria-sort is not a supported attribute on a button element -->
    <button aria-sort="">Sort by year</button>
  </main>
</body>
</html>
