<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>frame-focusable-content — Frames with focusable content must not have tabindex=-1</title>
  <style>body { font-family: Arial, sans-serif; margin: 2rem; background: #fff; color: #000; }</style>
</head>
<body>
  <main>
    <h1>frame-focusable-content Test Case</h1>
    <p>SC 2.1.1 — Frames with focusable content must not have tabindex=-1.</p>
    <!-- VIOLATION: iframe with tabindex="-1" that contains a focusable button -->
    <iframe
      srcdoc="<button>Click me</button>"
      tabindex="-1"
      title="My frame is an iframe"
    ></iframe>
  </main>
</body>
</html>
