<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>server-side-image-map — Server-side image maps must not be used</title>
  <style>body { font-family: Arial, sans-serif; margin: 2rem; background: #fff; color: #000; }</style>
</head>
<body>
  <main>
    <h1>server-side-image-map Test Case</h1>
    <p>SC 2.1.1 — Server-side image maps must not be used.</p>
    <!-- VIOLATION: img with ismap attribute (server-side image map) inside an anchor -->
    <a href="/map">
      <img src="data:image/gif;base64,R0lGODlhZABkAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
           alt="Server-side image map" ismap width="100" height="100">
    </a>
  </main>
</body>
</html>
