<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- VIOLATION: user-scalable=no disables pinch-to-zoom -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>meta-viewport — Zooming and scaling must not be disabled</title>
  <style>body { font-family: Arial, sans-serif; margin: 2rem; background: #fff; color: #000; }</style>
</head>
<body>
  <main>
    <h1>meta-viewport Test Case</h1>
    <p>SC 1.4.4 — Zooming and scaling must not be disabled.</p>
    <p>This page uses <code>user-scalable=no</code> which prevents users from zooming.</p>
  </main>
</body>
</html>
