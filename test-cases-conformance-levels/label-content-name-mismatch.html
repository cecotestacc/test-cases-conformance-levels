<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>label-content-name-mismatch — Elements must have their visible text as part of their accessible name</title>
  <style>body { font-family: Arial, sans-serif; margin: 2rem; background: #fff; color: #000; }</style>
</head>
<body>
  <main>
    <h1>label-content-name-mismatch Test Case</h1>
    <p>SC 2.5.3 — Elements must have their visible text as part of their accessible name.</p>
    <!-- VIOLATION: visible text is "The full label" but aria-label "the full" doesn't contain it -->
    <button name="link" aria-label="the full">The full label</button>
  </main>
</body>
</html>
