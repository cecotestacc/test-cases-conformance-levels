<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>no-autoplay-audio — video or audio elements must not play automatically</title>
  <style>body { font-family: Arial, sans-serif; margin: 2rem; background: #fff; color: #000; }</style>
</head>
<body>
  <main>
    <h1>no-autoplay-audio Test Case</h1>
    <p>SC 1.4.2 — <code>&lt;video&gt;</code> or <code>&lt;audio&gt;</code> elements must not play automatically.</p>
    <!-- VIOLATION: audio with autoplay and no muted attribute (actual audio > 3s) -->
    <audio autoplay controls>
      <source src="https://act-rules.github.io/test-assets/moon-audio/moon-speech.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </main>
</body>
</html>
