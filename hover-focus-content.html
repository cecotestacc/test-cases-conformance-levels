<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hover-focus-content — Content on hover or focus</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; background: #fff; color: #000; }
    .tt-wrap { position: relative; display: inline-block; }
    .tip {
      display: none;
      position: absolute;
      left: 0; top: 100%; margin-top: 0;
      background: #1e293b; color: #fff;
      padding: 6px 10px; border-radius: 4px;
      width: 240px; font-size: 0.85rem; z-index: 10;
      pointer-events: auto;
    }
    /* Tooltip appears on hover AND focus — no keyboard-only issue */
    .tt-wrap:hover .tip,
    .tt-wrap:focus-within .tip { display: block; }
    /* VIOLATION: no Escape handler — tooltip cannot be dismissed (SC 1.4.13) */
  </style>
</head>
<body>
  <main>
    <h1>hover-focus-content Test Case</h1>
    <p>SC 1.4.13 — Content on Hover or Focus must be hoverable, dismissible, and persistent.</p>
    <!-- VIOLATION: tooltip is not dismissible by Escape key (SC 1.4.13 / not-dismissible).
         Trigger and tooltip are wrapped in a single container so only 1 node is flagged. -->
    <p>Learn about
      <span class="tt-wrap">
        <a href="#wcag" tabindex="0" aria-describedby="tt1">WCAG 2.2</a>
        <span id="tt1" class="tip" role="tooltip">Web Content Accessibility Guidelines — the international standard for web accessibility.</span>
      </span>
      compliance.
    </p>
  </main>
</body>
</html>
