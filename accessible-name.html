<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>accessible-name — UI components must have an accessible name</title>
  <style>body { font-family: Arial, sans-serif; margin: 2rem; background: #fff; color: #000; }</style>
</head>
<body>
  <main>
    <h1>accessible-name Test Case</h1>
    <p>SC 4.1.2 — Name, Role, Value — user interface components must have a programmatically determined name.</p>
    <!-- VIOLATION: plain text nodes used as labels — not <label> elements and not referenced via aria-labelledby -->
    <form>
      <div>First name:</div>
      <input type="text" id="firstname">
      <div>Last name:</div>
      <input type="text" id="lastname">
      <button type="submit">Submit</button>
    </form>
  </main>
</body>
</html>
