<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>focus-visible — Focus indicator must be visible</title>
  <style>body { font-family: Arial, sans-serif; margin: 2rem; background: #fff; color: #000; }</style>
</head>
<body>
  <main>
    <h1>focus-visible Test Case</h1>
    <p>SC 2.4.7 — Any keyboard operable user interface has a mode of operation where the keyboard focus indicator is visible.</p>
    <form>
      <label for="q">Search</label>
      <input type="text" id="q" name="q">
      <!-- VIOLATION: onFocus="this.blur()" immediately removes focus — no focus indicator is ever visible -->
      <input type="submit" id="blur-submit" value="Search" onFocus="this.blur()">
    </form>
  </main>
</body>
</html>
