<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>focus-visible — Focus indicator must be visible</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; background: #fff; color: #000; }
    /* VIOLATION: all focus outlines suppressed — no focus indicator is ever visible */
    *:focus, *:focus-visible { outline: none !important; box-shadow: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>focus-visible Test Case</h1>
    <p>SC 2.4.7 — Focus Visible — any keyboard operable interface must have a visible focus indicator.</p>
    <form>
      <label for="q">Search</label>
      <input type="text" id="q" name="q">
      <button type="submit">Search</button>
    </form>
  </main>
</body>
</html>
