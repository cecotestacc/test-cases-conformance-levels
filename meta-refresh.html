<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>meta-refresh — Delayed refresh under 20 hours must not be used</title>
  <!-- VIOLATION: meta refresh with a non-zero delay -->
  <meta http-equiv="refresh" content="5">
  <style>body { font-family: Arial, sans-serif; margin: 2rem; background: #fff; color: #000; }</style>
</head>
<body>
  <main>
    <h1>meta-refresh Test Case</h1>
    <p>SC 2.2.1 — Delayed refresh under 20 hours must not be used.</p>
    <p>This page will auto-refresh after 5 seconds.</p>
  </main>
</body>
</html>
