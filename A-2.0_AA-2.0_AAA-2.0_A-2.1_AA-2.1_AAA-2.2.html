<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WCAG Conformance Level Combinations</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; background: #fff; color: #000; }
    /* AA+2.0: #aaa on #fff ≈ 2.32:1 — fails SC 1.4.3 minimum (4.5:1) */
    .fail-aa-2-0 { color: #aaa; }
    /* AAA+2.0: #666 on #fff ≈ 5.74:1 — passes SC 1.4.3 but fails SC 1.4.6 enhanced (7:1) */
    .fail-aaa-2-0 { color: #666; }
    /* AAA+2.2: ::after pseudo-element covers left 60% of the button including its focus ring.
       The visible portion of the focus ring averages <1px — fails SC 2.4.13 enhanced (2px min).
       ::after is not a DOM node so only 1 node (the button) is reported. */
    .focus-obs { position: relative; display: inline-block; }
    .focus-obs::after {
      content: '';
      position: absolute;
      top: -3px; left: -3px; bottom: -3px;
      width: 60%;
      background: #e0e0e0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>WCAG Conformance Level Combinations</h1>
    <p>One failing rule per WCAG level + version combination.</p>

    <!-- WCAG 2.0 — Level A: image-alt (SC 1.1.1) -->
    <!-- VIOLATION: img missing alt attribute -->
    <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="80" height="80">

    <!-- WCAG 2.0 — Level AA: color-contrast (SC 1.4.3) -->
    <!-- VIOLATION: #aaa on #fff ≈ 2.32:1, below 4.5:1 minimum -->
    <p class="fail-aa-2-0">This text fails minimum color contrast (SC 1.4.3, WCAG 2.0 AA).</p>

    <!-- WCAG 2.0 — Level AAA: color-contrast-enhanced (SC 1.4.6) -->
    <!-- VIOLATION: #666 on #fff ≈ 5.74:1, passes AA but below 7:1 enhanced threshold -->
    <p class="fail-aaa-2-0">This text passes AA contrast but fails enhanced contrast (SC 1.4.6, WCAG 2.0 AAA).</p>

    <!-- WCAG 2.1 — Level A: label-content-name-mismatch (SC 2.5.3) -->
    <!-- VIOLATION: td[role=rowheader] aria-label "Go" does not contain visible text "Search results" -->
    <!-- role=rowheader is in axe's label-content-name-mismatch list; td is not focusable so the
         behaviour scanner does not examine it — only the axe rule fires, not the behavioural one -->
    <table><tr>
      <td role="rowheader" aria-label="Go">Search results</td>
      <td>42</td>
    </tr></table>

    <!-- WCAG 2.1 — Level AA: autocomplete-valid (SC 1.3.5) -->
    <!-- VIOLATION: "badname" is not a valid autocomplete token -->
    <label>Username <input type="text" autocomplete="badname"></label>

    <!-- WCAG 2.2 — Level AAA: focus-visible/focus-appearance (SC 2.4.13) -->
    <!-- VIOLATION: ::after pseudo-element covers 60% of the button including its focus ring.
         The visible portion averages <1px thick — below SC 2.4.13's 2px minimum.
         Only 1 node fires (the button) because ::after is not a DOM node. -->
    <button class="focus-obs">Settings</button>
  </main>
</body>
</html>
