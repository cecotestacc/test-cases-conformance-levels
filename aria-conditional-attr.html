<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aria-conditional-attr — ARIA attributes must be used as specified for the element's role</title>
  <style>body { font-family: Arial, sans-serif; margin: 2rem; background: #fff; color: #000; }</style>
</head>
<body>
  <main>
    <h1>aria-conditional-attr Test Case</h1>
    <p>SC 4.1.2 — ARIA attributes must be used as specified for the element's role.</p>
    <!-- VIOLATION: aria-checked on a native checkbox input (native semantics conflict) -->
    <label>
      <input type="checkbox" aria-checked="true">
      I agree to make my website accessible
    </label>
  </main>
</body>
</html>
