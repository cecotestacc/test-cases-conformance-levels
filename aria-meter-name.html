<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aria-meter-name — ARIA meter nodes must have an accessible name</title>
  <style>body { font-family: Arial, sans-serif; margin: 2rem; background: #fff; color: #000; }</style>
</head>
<body>
  <main>
    <h1>aria-meter-name Test Case</h1>
    <p>SC 1.1.1 — ARIA meter nodes must have an accessible name.</p>
    <!-- VIOLATION: role="meter" with no accessible name -->
    <div role="meter" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100"></div>
  </main>
</body>
</html>
