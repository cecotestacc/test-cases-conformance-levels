<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aria-required-children — Certain ARIA roles must contain particular children</title>
  <style>body { font-family: Arial, sans-serif; margin: 2rem; background: #fff; color: #000; }</style>
</head>
<body>
  <main>
    <h1>aria-required-children Test Case</h1>
    <p>SC 1.3.1 — Certain ARIA roles must contain particular children.</p>
    <!-- VIOLATION: role="list" must contain role="listitem" children, not plain spans -->
    <div role="list">
      <span>Item 1</span>
    </div>
  </main>
</body>
</html>
