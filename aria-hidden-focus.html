<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aria-hidden-focus — ARIA hidden element must not contain focusable elements</title>
  <style>body { font-family: Arial, sans-serif; margin: 2rem; background: #fff; color: #000; }</style>
</head>
<body>
  <main>
    <h1>aria-hidden-focus Test Case</h1>
    <p>SC 4.1.2 — ARIA hidden element must not be focusable or contain focusable elements.</p>
    <!-- VIOLATION: focusable button inside aria-hidden container -->
    <div aria-hidden="true">
      <button>Hidden but focusable button</button>
    </div>
  </main>
</body>
</html>
