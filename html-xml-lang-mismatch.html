<!DOCTYPE html>
<!-- VIOLATION: lang="en" but xml:lang="fr" — base languages do not match -->
<html lang="en" xml:lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>html-xml-lang-mismatch — lang and xml:lang must have the same base language</title>
  <style>body { font-family: Arial, sans-serif; margin: 2rem; background: #fff; color: #000; }</style>
</head>
<body>
  <main>
    <h1>html-xml-lang-mismatch Test Case</h1>
    <p>SC 3.1.1 — HTML elements with lang and xml:lang must have the same base language.</p>
    <p>This page has <code>lang="en"</code> but <code>xml:lang="fr"</code>.</p>
  </main>
</body>
</html>
