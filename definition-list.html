<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>definition-list — dl elements must only directly contain properly-ordered dt and dd groups</title>
  <style>body { font-family: Arial, sans-serif; margin: 2rem; background: #fff; color: #000; }</style>
</head>
<body>
  <main>
    <h1>definition-list Test Case</h1>
    <p>SC 1.3.1 — <code>&lt;dl&gt;</code> elements must only directly contain properly-ordered <code>&lt;dt&gt;</code> and <code>&lt;dd&gt;</code> groups.</p>
    <!-- VIOLATION: <dl> has <dd> before <dt> (wrong order) -->
    <dl>
      <dd>Coffee</dd>
      <dt>Black hot drink</dt>
      <div>
        <dt>Milk</dt>
        <dd>White cold drink</dd>
      </div>
    </dl>
  </main>
</body>
</html>
